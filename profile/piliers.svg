<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" aria-label="Six piliers : déduction, expérimentation, rareté des briques, collection, transmission, progression maîtrisée"><style>.serif{font-family:'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif}.sans{font-family:'Avenir Next', 'Segoe UI', Futura, 'Helvetica Neue', sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, monospace}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style><rect x="0.75" y="0.75" width="998.5" height="528.5" rx="14" fill="#f3eee3" stroke="rgba(15, 31, 25, 0.14)" stroke-width="1.5"/><rect x="36" y="45" width="28" height="1.5" fill="#c23d1f"/><text class="mono" x="74" y="50" font-size="12" font-weight="700" letter-spacing="1.7" fill="#c23d1f">02 · LA BOUSSOLE</text><text class="serif" x="34" y="104" font-size="46" font-weight="600" letter-spacing="-1.6" fill="#0f1f19">Pourquoi on <tspan fill="#c23d1f" font-style="italic">y revient</tspan></text><rect x="36" y="146" width="296" height="164" rx="14" fill="#fffbf3" stroke="rgba(15, 31, 25, 0.9)" stroke-width="1.5"/><text class="mono" x="58" y="180" font-size="11" font-weight="700" letter-spacing="1.5" fill="#c23d1f">PILIER 01</text><g transform="translate(284,164)" fill="none" stroke="#0f1f19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M18 18l8 8"/></g><text class="serif" x="58" y="230" font-size="25" font-weight="600" letter-spacing="-0.5" fill="#0f1f19">Déduction</text><text class="sans" x="58" y="262" font-size="15" fill="#44564d">Une découverte s’anticipe</text><text class="sans" x="58" y="284" font-size="15" fill="#44564d">à partir d’indices cohérents.</text><rect x="352" y="146" width="296" height="164" rx="14" fill="#fffbf3" stroke="rgba(15, 31, 25, 0.9)" stroke-width="1.5"/><text class="mono" x="374" y="180" font-size="11" font-weight="700" letter-spacing="1.5" fill="#c23d1f">PILIER 02</text><g transform="translate(600,164)" fill="none" stroke="#0f1f19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h8M12 2v8L4 26h20L16 10V2"/></g><text class="serif" x="374" y="230" font-size="25" font-weight="600" letter-spacing="-0.5" fill="#0f1f19">Expérimentation</text><text class="sans" x="374" y="262" font-size="15" fill="#44564d">Une tentative est rapide.</text><text class="sans" x="374" y="284" font-size="15" fill="#44564d">Se tromper ne coûte rien.</text><rect x="668" y="146" width="296" height="164" rx="14" fill="#fffbf3" stroke="rgba(15, 31, 25, 0.9)" stroke-width="1.5"/><text class="mono" x="690" y="180" font-size="11" font-weight="700" letter-spacing="1.5" fill="#c23d1f">PILIER 03</text><g transform="translate(916,164)" fill="none" stroke="#0f1f19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h10v10H4zM14 14h10v10H14z"/></g><text class="serif" x="690" y="230" font-size="25" font-weight="600" letter-spacing="-0.5" fill="#0f1f19">Rareté des briques</text><text class="sans" x="690" y="262" font-size="15" fill="#44564d">Chaque exemplaire compte ;</text><text class="sans" x="690" y="284" font-size="15" fill="#44564d">seuls les plis en redonnent.</text><rect x="36" y="328" width="296" height="164" rx="14" fill="#fffbf3" stroke="rgba(15, 31, 25, 0.9)" stroke-width="1.5"/><text class="mono" x="58" y="362" font-size="11" font-weight="700" letter-spacing="1.5" fill="#c23d1f">PILIER 04</text><g transform="translate(284,346)" fill="none" stroke="#0f1f19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h8v8H4zM16 4h8v8h-8zM4 16h8v8H4zM16 16h8v8h-8z"/></g><text class="serif" x="58" y="412" font-size="25" font-weight="600" letter-spacing="-0.5" fill="#0f1f19">Collection</text><text class="sans" x="58" y="444" font-size="15" fill="#44564d">Chaque découverte complète</text><text class="sans" x="58" y="466" font-size="15" fill="#44564d">un codex lisible.</text><rect x="352" y="328" width="296" height="164" rx="14" fill="#fffbf3" stroke="rgba(15, 31, 25, 0.9)" stroke-width="1.5"/><text class="mono" x="374" y="362" font-size="11" font-weight="700" letter-spacing="1.5" fill="#c23d1f">PILIER 05</text><g transform="translate(600,346)" fill="none" stroke="#0f1f19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h22v13H13l-6 5v-5H3z"/></g><text class="serif" x="374" y="412" font-size="25" font-weight="600" letter-spacing="-0.5" fill="#0f1f19">Transmission</text><text class="sans" x="374" y="444" font-size="15" fill="#44564d">Le résultat explique la</text><text class="sans" x="374" y="466" font-size="15" fill="#44564d">filiation sans casser le rythme.</text><rect x="668" y="328" width="296" height="164" rx="14" fill="#fffbf3" stroke="rgba(15, 31, 25, 0.9)" stroke-width="1.5"/><text class="mono" x="690" y="362" font-size="11" font-weight="700" letter-spacing="1.5" fill="#c23d1f">PILIER 06</text><g transform="translate(916,346)" fill="none" stroke="#0f1f19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 24l7-9 6 4 9-14"/></g><text class="serif" x="690" y="412" font-size="25" font-weight="600" letter-spacing="-0.5" fill="#0f1f19">Progression maîtrisée</text><text class="sans" x="690" y="444" font-size="15" fill="#44564d">Aucune brique impossible,</text><text class="sans" x="690" y="466" font-size="15" fill="#44564d">aucune attente sans fin.</text></svg>
