<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Table de fusion : télé- plus -scope donne télescope"><style>.serif{font-family:'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif}.sans{font-family:'Avenir Next', 'Segoe UI', Futura, 'Helvetica Neue', sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, monospace}@media (prefers-reduced-motion: reduce){*{animation:none !important}}.b1,.b2{animation:2.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite alternate}.b1{animation-name:in1}.b2{animation-name:in2}@keyframes in1{0%,30%{transform:translateX(-14px)}100%{transform:none}}@keyframes in2{0%,30%{transform:translateX(14px)}100%{transform:none}}.res{animation:pop 2.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes pop{0%,60%{opacity:0;transform:scale(0.85) rotate(-3deg)}100%{opacity:1;transform:none}}</style><rect x="0.75" y="0.75" width="998.5" height="398.5" rx="14" fill="#0f1f19" stroke="rgba(243, 238, 227, 0.14)" stroke-width="1.5"/><rect x="36" y="45" width="28" height="1.5" fill="#ff6b4a"/><text class="mono" x="74" y="50" font-size="12" font-weight="700" letter-spacing="1.7" fill="#ff6b4a">01 · LA TABLE DE FUSION</text><text class="serif" x="34" y="104" font-size="46" font-weight="600" letter-spacing="-1.6" fill="#f3eee3">Le jeu en <tspan fill="#ff6b4a" font-style="italic">trente secondes</tspan></text><g class="b1"><rect x="40" y="174" width="232" height="104" rx="10" fill="rgba(243, 238, 227, 0.28)"/><rect x="36" y="170" width="232" height="104" rx="10" fill="#cdf25a" stroke="#0f1f19" stroke-width="1.5"/><text class="mono" x="52" y="194" font-size="11" letter-spacing="0.66" fill="#0f1f19">PRÉFIXE · GREC ANCIEN</text><text class="serif" x="52" y="256" font-size="40" font-weight="700" fill="#0f1f19">télé-</text></g><text class="serif" x="290" y="236" font-size="40" fill="#f3eee3">+</text><g class="b2"><rect x="330" y="174" width="232" height="104" rx="10" fill="rgba(243, 238, 227, 0.28)"/><rect x="326" y="170" width="232" height="104" rx="10" fill="#4fd1c5" stroke="#0f1f19" stroke-width="1.5"/><text class="mono" x="342" y="194" font-size="11" letter-spacing="0.66" fill="#0f1f19">SUFFIXE · GREC ANCIEN</text><text class="serif" x="342" y="256" font-size="40" font-weight="700" fill="#0f1f19">-scope</text></g><text class="serif" x="582" y="236" font-size="40" fill="#f3eee3">=</text><g class="res"><rect x="620" y="160" width="344" height="124" rx="14" fill="#182c24" stroke="rgba(243, 238, 227, 0.8)" stroke-width="1.5"/><circle cx="650" cy="190" r="8" fill="#ff6b4a" stroke="#0f1f19" stroke-width="1.5"/><text class="mono" x="668" y="195" font-size="11" font-weight="700" letter-spacing="1.5" fill="#ff6b4a">DÉCOUVERTE · CODEX</text><text class="serif" x="640" y="256" font-size="48" font-weight="600" letter-spacing="-1.9" fill="#f3eee3">télescope</text></g><line x1="36" x2="964" y1="318" y2="318" stroke="rgba(243, 238, 227, 0.14)" stroke-width="1.5"/><text class="sans" x="36" y="358" font-size="16" fill="#b8c6bd">Se tromper ne coûte rien : seule une découverte consomme un exemplaire de chaque brique.</text></svg>
