<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Table de fusion : télé- plus -scope donne télescope"><style>.serif{font-family:'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif}.sans{font-family:'Avenir Next', 'Segoe UI', Futura, 'Helvetica Neue', sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, monospace}@media (prefers-reduced-motion: reduce){*{animation:none !important}}.b1,.b2{animation:2.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite alternate}.b1{animation-name:in1}.b2{animation-name:in2}@keyframes in1{0%,30%{transform:translateX(-14px)}100%{transform:none}}@keyframes in2{0%,30%{transform:translateX(14px)}100%{transform:none}}.res{animation:pop 2.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes pop{0%,60%{opacity:0;transform:scale(0.85) rotate(-3deg)}100%{opacity:1;transform:none}}</style><rect x="0.75" y="0.75" width="998.5" height="398.5" rx="14" fill="#f3eee3" stroke="rgba(15, 31, 25, 0.14)" stroke-width="1.5"/><rect x="36" y="45" width="28" height="1.5" fill="#c23d1f"/><text class="mono" x="74" y="50" font-size="12" font-weight="700" letter-spacing="1.7" fill="#c23d1f">01 · LA TABLE DE FUSION</text><text class="serif" x="34" y="104" font-size="46" font-weight="600" letter-spacing="-1.6" fill="#0f1f19">Le jeu en <tspan fill="#c23d1f" font-style="italic">trente secondes</tspan></text><g class="b1"><rect x="150" y="182" width="189" height="84" rx="10" fill="#0f1f19"/><rect x="146" y="178" width="189" height="84" rx="10" fill="#cdf25a" stroke="#0f1f19" stroke-width="1.5"/><text class="mono" x="164" y="203" font-size="11" letter-spacing="0.66" fill="#0f1f19">PRÉFIXE · GREC ANCIEN</text><text class="serif" x="164" y="244" font-size="34" font-weight="700" fill="#0f1f19">télé-</text></g><text class="serif" x="365" y="234" text-anchor="middle" font-size="40" fill="#0f1f19">+</text><g class="b2"><rect x="399" y="182" width="189" height="84" rx="10" fill="#0f1f19"/><rect x="395" y="178" width="189" height="84" rx="10" fill="#4fd1c5" stroke="#0f1f19" stroke-width="1.5"/><text class="mono" x="413" y="203" font-size="11" letter-spacing="0.66" fill="#0f1f19">SUFFIXE · GREC ANCIEN</text><text class="serif" x="413" y="244" font-size="34" font-weight="700" fill="#0f1f19">-scope</text></g><text class="serif" x="614" y="234" text-anchor="middle" font-size="40" fill="#0f1f19">=</text><g class="res"><rect x="648" y="182" width="210" height="84" rx="10" fill="#0f1f19"/><rect x="644" y="178" width="210" height="84" rx="10" fill="#fffbf3" stroke="#0f1f19" stroke-width="1.5"/><circle cx="668" cy="199" r="6" fill="#ff6b4a" stroke="#0f1f19" stroke-width="1.5"/><text class="mono" x="682" y="203" font-size="11" letter-spacing="0.66" fill="#0f1f19">DÉCOUVERTE · FRANÇAIS</text><text class="serif" x="662" y="244" font-size="34" font-weight="700" fill="#0f1f19">télescope</text></g><line x1="36" x2="964" y1="318" y2="318" stroke="rgba(15, 31, 25, 0.14)" stroke-width="1.5"/><text class="sans" x="36" y="358" font-size="16" fill="#44564d">Se tromper ne coûte rien : seule une découverte consomme un exemplaire de chaque brique.</text></svg>
